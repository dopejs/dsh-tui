name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # A run that stops exiting must fail the job, not occupy a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24.x
          - os: macos-latest
            node: 22.19.0
          - os: windows-latest
            node: 22.19.0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Installs the real tarball into a clean profile, then launches it:
      # interactive PTY flows plus the one-shot --doctor and --print contracts,
      # each bounded so a run that never exits fails instead of hanging.
      - name: Clean-profile install and launch
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0'
        run: pnpm test:package
